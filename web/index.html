<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f18" />
  <title>Gutenbergs Druckerpresse · LMG TECH</title>
  <meta name="description" content="Interaktive 3D-Animation: Wie Gutenberg mit beweglichen Lettern und einer Spindelpresse druckte – vom Setzen bis zum fertigen Bogen." />
  <meta property="og:image" content="preview.jpg" />
  <link rel="icon" type="image/png" href="lmg-tech-logo.png" />
  <link rel="apple-touch-icon" href="lmg-tech-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
  <style>
    :root { --accent-rgb: 227, 180, 91; --ink: #0a0f18; }
    .tally .t.ink i { background: #e9e2d0; box-shadow: inset 0 0 0 2px #1a1a1a; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="3D-Ansicht: Gutenbergs Druckerpresse in der Werkstatt"></canvas>
    <div id="dip"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div id="hotspots" aria-live="off"></div>
    <div id="hoverTip" role="tooltip"></div>

    <header class="brand">
      <a class="logo" href="#" aria-label="LMG TECH"><img src="lmg-tech-logo.png" alt="LMG TECH Logo" width="72" height="72" /></a>
      <div class="titles">
        <div class="eyebrow">Medienrevolution · Geschichte</div>
        <h1>Gutenberg <em>druckt</em></h1>
        <p>Mainz, um 1454 · bewegliche Lettern und Spindelpresse</p>
      </div>
    </header>

    <div class="tally" id="tally" aria-label="Fortschritt">
      <span class="t"><i></i>Lettern im Satz <b id="tSorts">0</b></span>
      <span class="t ink"><i></i>Bögen <b id="tSheets">0</b></span>
    </div>

    <nav class="index" id="index" aria-label="Bauteile">
      <button class="index-toggle" id="indexToggle" aria-expanded="true" aria-controls="partList">
        <span>Bauteile</span><span class="count" id="partCount"></span><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <ol id="partList"></ol>
    </nav>

    <aside id="info" class="info" aria-hidden="true">
      <div class="grab" aria-hidden="true"></div>
      <button class="close" id="infoClose" aria-label="Schließen">×</button>
      <div class="info-kicker"><span class="swatch"></span><span id="infoKicker"></span></div>
      <h2 id="infoTitle"></h2>
      <div class="live" id="infoLive" hidden></div>
      <p id="infoText"></p>
      <dl id="infoFacts"></dl>
      <div class="info-actions">
        <button class="btn" id="infoFocus">Heranzoomen</button>
        <button class="btn ghost" id="infoPrev" aria-label="Vorheriges Bauteil">←</button>
        <button class="btn ghost" id="infoNext" aria-label="Nächstes Bauteil">→</button>
      </div>
    </aside>

    <div class="readout" aria-label="Messwerte">
      <div><span class="k">Karren</span><span class="v" id="rCar">—</span></div>
      <div><span class="k">Bengel</span><span class="v" id="rBar">0°</span></div>
      <div><span class="k">Presskraft</span><span class="v" id="rForce">0 kN</span></div>
      <div><span class="k">Tempo</span><span class="v" id="rSlow">Echtzeit</span></div>
    </div>

    <div class="zoom" aria-label="Zoom">
      <button id="zoomIn" aria-label="Hineinzoomen">+</button>
      <input id="zoomSlider" type="range" min="0" max="1000" value="500" aria-label="Zoomstufe" />
      <button id="zoomOut" aria-label="Herauszoomen">−</button>
    </div>

    <div class="scalebar" aria-label="Maßstab"><div class="bar" id="scaleBar"></div><span id="scaleLabel">50 cm</span></div>

    <section class="phase" id="phase" aria-live="polite">
      <div class="phase-top">
        <span class="phase-no" id="phaseNo">01 / 10</span>
        <span class="phase-nav">
          <button id="phasePrev" aria-label="Vorheriger Arbeitsschritt">‹</button>
          <button id="phaseNext" aria-label="Nächster Arbeitsschritt">›</button>
        </span>
      </div>
      <h3 id="phaseTitle">Die bewegliche Letter</h3>
      <p id="phaseText"></p>
      <div class="phase-track" id="phaseTrack"></div>
    </section>

    <footer class="controls" id="controls">
      <button class="play" id="play" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>
      </button>
      <div class="timeline">
        <input id="scrub" type="range" min="0" max="10000" value="0" step="1" aria-label="Zeitleiste" />
        <div class="ticks" id="ticks"></div>
      </div>
      <button class="opts-btn" id="optsBtn" aria-label="Optionen" aria-expanded="false" aria-controls="opts">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <div class="opts" id="opts">
        <label class="sel">Tempo
          <select id="speed">
            <option value="0.25">0,25×</option>
            <option value="0.5">0,5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1,5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <button class="chip on" id="labels" aria-pressed="true" title="Beschriftungen ein/aus">Labels</button>
        <button class="chip on" id="follow" aria-pressed="true" title="Kamera folgt dem Arbeitsschritt">Folgen</button>
        <button class="chip" id="reset" title="Ansicht zurücksetzen">Ansicht</button>
      </div>
    </footer>

    <div id="loader">
      <div class="loader-inner">
        <img src="lmg-tech-logo.png" alt="" width="64" height="64" />
        <div class="loader-title">Lade Werkstatt</div>
        <div class="loader-bar"><i id="loadBar"></i></div>
        <div class="loader-pct" id="loadPct">0 %</div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
